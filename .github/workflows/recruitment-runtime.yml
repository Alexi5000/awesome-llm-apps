name: Recruitment PDF dependency runtime
on:
  pull_request:
    paths:
      - 'advanced_ai_agents/multi_agent_apps/agent_teams/ai_recruitment_agent_team/**'
      - '.github/workflows/recruitment-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'advanced_ai_agents/multi_agent_apps/agent_teams/ai_recruitment_agent_team/**'
      - '.github/workflows/recruitment-runtime.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: advanced_ai_agents/multi_agent_apps/agent_teams/ai_recruitment_agent_team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
