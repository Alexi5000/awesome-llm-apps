name: Voice and math retrieval runtime
on:
  pull_request:
    paths:
      - 'voice_ai_agents/voice_rag_openaisdk/**'
      - 'rag_tutorials/agentic_rag_math_agent/**'
      - '.github/workflows/voice-math-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'voice_ai_agents/voice_rag_openaisdk/**'
      - 'rag_tutorials/agentic_rag_math_agent/**'
      - '.github/workflows/voice-math-runtime.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        example: [voice_ai_agents/voice_rag_openaisdk, rag_tutorials/agentic_rag_math_agent]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
