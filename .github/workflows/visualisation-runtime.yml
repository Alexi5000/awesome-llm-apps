name: Visualization dependency runtime
on:
  pull_request:
    paths:
      - 'starter_ai_agents/ai_data_visualisation_agent/**'
      - '.github/workflows/visualisation-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'starter_ai_agents/ai_data_visualisation_agent/**'
      - '.github/workflows/visualisation-runtime.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: starter_ai_agents/ai_data_visualisation_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
