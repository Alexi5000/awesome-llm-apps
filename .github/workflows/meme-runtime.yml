name: Meme browser dependency runtime
on:
  pull_request:
    paths:
      - 'starter_ai_agents/ai_meme_generator_agent_browseruse/**'
      - '.github/workflows/meme-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'starter_ai_agents/ai_meme_generator_agent_browseruse/**'
      - '.github/workflows/meme-runtime.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python: '3.11'
            installer: uv
          - python: '3.12'
            installer: pip
    env:
      ANONYMIZED_TELEMETRY: 'false'
      BROWSER_USE_DISABLE_CLOUD: 'true'
    defaults:
      run:
        working-directory: starter_ai_agents/ai_meme_generator_agent_browseruse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: matrix.installer == 'uv'
      - run: uv sync --frozen --group test
        if: matrix.installer == 'uv'
      - run: uv pip check
        if: matrix.installer == 'uv'
      - run: uv run --frozen --group test python -m unittest discover -s tests -v
        if: matrix.installer == 'uv'
      - run: python -m pip install -r requirements-test.txt
        if: matrix.installer == 'pip'
      - run: python -m pip check
        if: matrix.installer == 'pip'
      - run: python -m unittest discover -s tests -v
        if: matrix.installer == 'pip'
