name: Database routing dependency runtime
on:
  pull_request:
    paths:
      - 'rag_tutorials/rag_database_routing/**'
      - '.github/workflows/routing-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'rag_tutorials/rag_database_routing/**'
      - '.github/workflows/routing-runtime.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rag_tutorials/rag_database_routing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv pip install --system --torch-backend cpu -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
