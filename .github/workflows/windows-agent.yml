name: Windows agent runtime

on:
  pull_request:
    paths:
      - 'advanced_ai_agents/single_agent_apps/windows_use_autonomous_agent/**'
      - '.github/workflows/windows-agent.yml'
  push:
    branches: [main]
    paths:
      - 'advanced_ai_agents/single_agent_apps/windows_use_autonomous_agent/**'
      - '.github/workflows/windows-agent.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: advanced_ai_agents/single_agent_apps/windows_use_autonomous_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --no-install-project
      - run: .venv/Scripts/python -m unittest discover -s tests -v
      - run: uvx pip-audit --path .venv/Lib/site-packages
