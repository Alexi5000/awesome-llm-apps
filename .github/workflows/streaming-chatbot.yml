name: Streaming chatbot runtime
on:
  pull_request:
    paths:
      - 'advanced_llm_apps/chat_with_X_tutorials/streaming_ai_chatbot/**'
      - '.github/workflows/streaming-chatbot.yml'
  push:
    branches: [main]
    paths:
      - 'advanced_llm_apps/chat_with_X_tutorials/streaming_ai_chatbot/**'
      - '.github/workflows/streaming-chatbot.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: advanced_llm_apps/chat_with_X_tutorials/streaming_ai_chatbot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run patch:zod
      - run: npm test
      - run: npm run generate-types
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- types.d.ts
