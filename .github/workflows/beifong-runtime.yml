name: Beifong dependency runtime

on:
  pull_request:
    paths:
      - 'advanced_ai_agents/multi_agent_apps/ai_news_and_podcast_agents/beifong/**'
      - '.github/workflows/beifong-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'advanced_ai_agents/multi_agent_apps/ai_news_and_podcast_agents/beifong/**'
      - '.github/workflows/beifong-runtime.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: advanced_ai_agents/multi_agent_apps/ai_news_and_podcast_agents/beifong
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt
      - run: uv pip check --python .venv/bin/python
      - run: .venv/bin/python -m unittest discover -s tests -p test_dependency_runtime.py -v
